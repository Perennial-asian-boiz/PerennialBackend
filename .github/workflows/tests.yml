name: Backend tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  postgres-tests:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: perennial_test
          POSTGRES_PASSWORD: synthetic_ci_only
          POSTGRES_DB: perennial_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U perennial_test -d perennial_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      REQUIRE_DATABASE_TESTS: "1"
      TEST_DATABASE_URL: postgresql+psycopg://perennial_test:synthetic_ci_only@127.0.0.1:5432/perennial_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client-16
      - run: python -m pytest -q
        working-directory: development/backend
