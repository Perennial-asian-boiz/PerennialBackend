# Alembic configuration for the Perennial database.
# Run from development/database:  alembic upgrade head
# The database URL comes from DATABASE_URL (environment, then
# development/backend/.env); it is never stored in this file.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/../backend
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
