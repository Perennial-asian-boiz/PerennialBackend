[tool.ruff]
target-version = "py312"
line-length = 88
# Gate the database path and Supabase account surface. Legacy services and
# separately owned contract tests are not swept into formatting-only rewrites.
include = [
    "development/backend/src/api/**/*.py",
    "development/backend/src/db/**/*.py",
    "development/backend/src/ingestion/**/*.py",
    "development/backend/src/pipeline/**/*.py",
    "development/database/ops/quality_gate.py",
    "development/database/ops/provision_api_role.py",
    "development/backend/tests/test_supabase_accounts.py",
    "development/database/migrations/versions/20261018_supabase_accounts.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
mypy_path = "development/backend"
files = [
    "development/backend/src/db",
    "development/backend/src/ingestion",
    "development/backend/src/pipeline",
]
strict = true
show_error_codes = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["src.services.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true
