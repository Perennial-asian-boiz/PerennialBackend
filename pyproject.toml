[project]
name = "perennial-backend"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "requests==2.34.2",
    "urllib3==2.8.0",
    "certifi==2026.6.17",
    "python-dotenv==1.2.2",
    "apscheduler==3.11.3",
    "SQLAlchemy==2.0.54",
    "psycopg[binary]==3.3.6",
    "alembic==1.20.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "fastapi==0.143.1",
    "uvicorn==0.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "ruff==0.16.10",
    "mypy==2.4.0",
    "types-requests==2.33.0.20261006",
    "pip-audit==2.10.1",
    "pip-tools==7.6.2",
    "httpx2==2.13.1",
]

[tool.ruff]
target-version = "py312"
line-length = 88
# Gate the database path and Supabase account surface. Legacy services and
# separately owned contract tests are not swept into formatting-only rewrites.
include = [
    "development/backend/src/api/**/*.py",
    "development/backend/src/settings.py",
    "development/backend/src/db/**/*.py",
    "development/backend/src/ingestion/**/*.py",
    "development/backend/src/pipeline/**/*.py",
    "development/database/ops/quality_gate.py",
    "development/database/ops/provision_api_role.py",
    "development/backend/tests/test_supabase_accounts.py",
    "development/database/migrations/versions/20261018_supabase_accounts.py",
    "development/database/migrations/versions/20261018_registration_email_check.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
mypy_path = "development/backend"
files = [
    "development/backend/src/settings.py",
    "development/backend/src/db",
    "development/backend/src/ingestion",
    "development/backend/src/pipeline",
]
strict = true
show_error_codes = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["src.services.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true
