[project]
name = "perennial-backend"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "requests==2.34.2",
    "urllib3==2.8.0",
    "certifi==2026.10.19",
    "python-dotenv==1.2.2",
    "apscheduler==3.11.3",
    "SQLAlchemy==2.0.54",
    "psycopg[binary]==3.3.6",
    "alembic==1.20.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pypdf==6.21.4",
    # M5 read API; the same pins as #22 so its rebase is a lock recompile.
    "fastapi==0.143.1",
    "uvicorn==0.34.0",
    # S1-11 market status (Q8). Keep it current: its calendars reach about a year
    # ahead, and unscheduled closures arrive only in library releases.
    "exchange-calendars==4.13.2",
    # S1-12 summary readability at ingestion (CS-2). Exact: the grade formulas
    # have shifted between versions. 0.7.8 is the newest release whose syllable
    # data ships in a package (cmudict); 0.7.9+ download nltk's corpus at runtime.
    "textstat==0.7.8",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "ruff==0.16.10",
    "mypy==2.4.0",
    "types-requests==2.33.0.20261006",
    "pip-audit==2.10.1",
    "pip-tools==7.6.2",
    # starlette 1.9's TestClient imports httpx2 (httpx is deprecated there).
    "httpx2==2.13.1",
]

[tool.ruff]
target-version = "py312"
line-length = 88
# T20 covers all source modules; preserve the previous E/F/I and formatter
# boundary for untouched legacy modules until their owners migrate them.
include = [
    "development/backend/src/**/*.py",
    # Standalone sentiment scripts: outside src/ because the scorer uses a
    # model package, which src/ may not import (test_s1_12_ingestion CS-3).
    "development/backend/sentiment/**/*.py",
    "development/database/ops/quality_gate.py",
    "development/database/ops/provision_api_role.py",
    "development/database/ops/seed_names.py",
    "development/backend/tests/test_supabase_accounts.py",
    "development/backend/tests/test_pr22_auth_hardening.py",
    "development/backend/tests/test_pr22_auth_hardening_edges.py",
    "development/backend/tests/test_pr22_confirm_prefix.py",
    "development/database/migrations/versions/20261018_0014_supabase_accounts.py",
    "development/database/migrations/versions/20261018_0015_registration_email_check.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "T20"]

[tool.ruff.lint.per-file-ignores]
"development/backend/src/services/consensus_watchlist/scheduler/cron.py" = ["T20", "E4", "E7", "E9", "F", "I"]
# These files remain subject to T20; only their pre-existing lint scope is retained.
"development/backend/src/services/consensus_watchlist/consensus.py" = ["E4", "E7", "E9", "F", "I"]
"development/backend/src/services/gdelt/client.py" = ["E4", "E7", "E9", "F", "I"]
"development/backend/src/services/news/news_fetcher.py" = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
exclude = [
    "development/backend/src/services/consensus_watchlist/consensus.py",
    "development/backend/src/services/consensus_watchlist/paths.py",
    "development/backend/src/services/consensus_watchlist/scheduler/cron.py",
    "development/backend/src/services/gdelt/client.py",
    "development/backend/src/services/gdelt/spikes.py",
    "development/backend/src/services/gdelt/themes.py",
    "development/backend/src/services/news/news_fetcher.py",
]

[tool.mypy]
python_version = "3.12"
# The fetchers load as top-level modules (fmp, ark, ...) next to paths.py, as
# scheduler/cron.py and collectors._fetcher import them at runtime. They are
# checked strictly through src/ingestion/adapters.py, which imports them.
mypy_path = "development/backend,development/backend/src/services/consensus_watchlist,development/backend/src/services/consensus_watchlist/fetchers"
files = [
    "development/backend/src/settings.py",
    "development/backend/src/db",
    "development/backend/src/ingestion",
    "development/backend/src/pipeline",
    "development/backend/src/services/fundamentals",
    "development/backend/src/services/scores",
    "development/backend/src/services/news/finnhub.py",
    "development/backend/src/services/news/matching.py",
    "development/backend/src/services/news/job.py",
    # Decision 29: the read API, the dashboard adapters and the integrated app;
    # #22's accounts, supabase_auth and account_models get typed in a follow-up.
    "development/backend/src/api/__init__.py",
    "development/backend/src/api/__main__.py",
    "development/backend/src/api/app.py",
    "development/backend/src/api/dashboard.py",
    "development/backend/src/api/dashboard_fixture.py",
    "development/backend/src/api/market_status.py",
    "development/backend/src/api/rate_limit.py",
    "development/backend/src/api/read.py",
]
strict = true
show_error_codes = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["src.services.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
# Not yet strict (decision 29): analyzed for app.py's imports, errors not reported.
module = ["src.api.accounts", "src.api.supabase_auth", "src.api.account_models"]
follow_imports = "silent"

[[tool.mypy.overrides]]
# Shared legacy path helpers: analyzed for the fetchers' types, not yet strict.
module = ["paths"]
follow_imports = "silent"

[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# S1-12's readability library ships no type information.
module = ["textstat"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# S1-11's calendar library ships no type information.
module = ["exchange_calendars"]
ignore_missing_imports = true
